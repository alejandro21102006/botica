name: compras-prod

services:
  mysql-compras:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${COMPRAS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${COMPRAS_MYSQL_DATABASE}
    ports:
      - "3462:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${COMPRAS_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_compras_data:/var/lib/mysql
    networks:
      - compras-int

  compras:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-compras:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      COMPRAS_DB_HOST: ${COMPRAS_DB_HOST}
      COMPRAS_DB_PORT: ${COMPRAS_DB_PORT}
      COMPRAS_DB_NAME: ${COMPRAS_DB_NAME}
      COMPRAS_DB_USERNAME: ${COMPRAS_DB_USERNAME}
      COMPRAS_DB_PASSWORD: ${COMPRAS_DB_PASSWORD}
    ports:
      - "9162:9162"
    networks:
      - compras-int
      - ms-net

volumes:
  mysql_compras_data:

networks:
  ms-net:
    external: true
    name: ms-net
  compras-int:
    name: compras-int