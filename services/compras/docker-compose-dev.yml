name: compras-dev

services:
  mysql-compras-dev:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_compras
    ports:
      - "3461:3306"
    volumes:
      - mysql_compras_dev_data:/var/lib/mysql

volumes:
  mysql_compras_dev_data: