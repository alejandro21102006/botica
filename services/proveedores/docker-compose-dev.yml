name: proveedores-dev

services:
  mysql-proveedores-dev:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_proveedores
    ports:
      - "3451:3306"
    volumes:
      - mysql_proveedores_dev_data:/var/lib/mysql

volumes:
  mysql_proveedores_dev_data: